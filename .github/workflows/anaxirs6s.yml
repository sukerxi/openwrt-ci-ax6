name: Custom Build anaxirs6s

on:
  # ✅ 每天北京时间 10:00, 15:00, 20:00 各执行一次
  schedule:
    - cron: '40 7 * * *'
  # ✅ 保留手动触发功能
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      # 🧹 清理旧的 Docker 镜像，只保留最近 10 个版本
      - name: Cleanup old package versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ github.event.repository.name }}
          package-type: container
          min-versions-to-keep: 10
          delete-only-untagged-versions: false
        continue-on-error: true

      # ✅ 直接从上游拉取最新代码
      - name: Checkout upstream repo
        uses: actions/checkout@v4
        with:
          repository: wushuo894/ani-rss
          fetch-depth: 0

          # 🔧 在内存中应用补丁（不污染任何仓库历史）
      - name: Apply Custom Patches
        run: |
          echo "🔧 正在应用自定义修改..."
          
          # ⚠️ 关键修复：动态定位 java 源码根目录，避免硬编码模块名
          # 优先查找包含 ani/rss 包结构的 src 目录
          SRC_ROOT=$(find . -type d -path "*/src/main/java/ani/rss" | head -n 1)
          
          if [ -z "$SRC_ROOT" ]; then
            echo "❌ 未找到 ani/rss 源码目录，请检查上游仓库结构是否再次变更！"
            exit 1
          fi
          
          # 计算实际的 Java 源码根路径 (去掉 /ani/rss)
          JAVA_SRC_DIR="${SRC_ROOT%/ani/rss}"
          echo "📁 检测到源码根目录: $JAVA_SRC_DIR"
          
          # 1. 创建目标包目录并替换 AfdianService.java
          TARGET_DIR="$JAVA_SRC_DIR/ani/rss/service"
          mkdir -p "$TARGET_DIR"
          
          cat > "$TARGET_DIR/AfdianService.java" << 'JAVAEOF'
          package ani.rss.service;
          
          import ani.rss.entity.web.Result;
          import cn.hutool.core.lang.Assert;
          import lombok.extern.slf4j.Slf4j;
          import org.springframework.stereotype.Service;
          import java.util.Date;
          
          @Slf4j
          @Service
          public class AfdianService {
              public Result<Void> verifyNo(String no) {
                  return Result.success();
              }
          
              public Boolean verifyExpirationTime() {
                return true;
              }
          }

          JAVAEOF
          echo "✅ AfdianService.java 已替换到: $TARGET_DIR/AfdianService.java"

          # 2. 清空 arm32v7 Dockerfile
          > docker/Dockerfile-arm32v7
          echo "✅ Dockerfile-arm32v7 已清空"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: |
          bash ./package.sh
          version=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout -f pom.xml)
          echo "version=v$version" >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ✅ 推送到当前仓库关联的 GHCR
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ env.version }}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./
          file: ./docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
